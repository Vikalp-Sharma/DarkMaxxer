<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;background-image:radial-gradient(circle at 50% 45%,rgba(105,30,166,0.12) 0%,rgba(10,10,15,1) 70%);display:flex;align-items:center;justify-content:center}.c{display:flex;flex-direction:column;align-items:center;animation:containerIn .6s ease-out}.logo-wrap{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center}.glow-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(168,85,247,0.3);animation:spinCW 2s linear infinite;box-shadow:0 0 30px rgba(168,85,247,0.2),inset 0 0 20px rgba(168,85,247,0.05)}.glow-ring::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;background:#a855f7;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 12px 3px rgba(168,85,247,0.8)}.logo{width:100px;height:100px;border-radius:50%;animation:spinCW 2s linear infinite;filter:drop-shadow(0 0 15px rgba(168,85,247,0.4))}.t{color:#e0e3e5;font-family:Segoe UI,sans-serif;font-size:20px;font-weight:600;margin-top:22px;letter-spacing:3px;text-transform:uppercase;animation:fadeIn 1s ease-out .3s both}.dots{display:flex;gap:6px;margin-top:16px;animation:fadeIn 1s ease-out .6s both}.dot{width:6px;height:6px;border-radius:50%;background:rgba(168,85,247,0.6);animation:bounce .6s ease-in-out infinite alternate}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes spinCW{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes bounce{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}@keyframes containerIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}</style></head><body><div class="c"><div class="logo-wrap"><div class="glow-ring"></div><img class="logo" src="file:///S:/Programs/DarkMaxxer/gui/logo.png" alt=""></div><div class="t">DarkMaxxer</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></body></html>
