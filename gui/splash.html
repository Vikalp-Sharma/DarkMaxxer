<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMaxxer AI — Loading</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0f;
    background-image: 
      radial-gradient(circle at 50% 45%, rgba(168, 85, 247, 0.15) 0%, rgba(10, 10, 15, 0.95) 65%),
      radial-gradient(circle at 20% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .logo-wrap {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glow-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(168, 85, 247, 0.35);
    border-top: 2px solid rgba(168, 85, 247, 0.95);
    border-right: 2px solid rgba(6, 182, 212, 0.7);
    animation: spinCW 2s linear infinite;
    box-shadow: 
      0 0 30px rgba(168, 85, 247, 0.3),
      inset 0 0 20px rgba(168, 85, 247, 0.1);
  }
  .glow-ring::after {
    content: "";
    position: absolute;
    top: -4px;
    left: 50%;
    width: 8px;
    height: 8px;
    background: #00ffff;
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 16px 4px rgba(0, 255, 255, 0.9);
  }
  .logo {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    animation: spinCW 2.5s linear infinite;
    filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.5));
    object-fit: cover;
  }
  .title {
    color: #f1f5f9;
    font-size: 24px;
    font-weight: 700;
    margin-top: 26px;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: fadeIn 1s ease-out 0.2s both;
    text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
  }
  .status-text {
    color: #94a3b8;
    font-size: 13px;
    font-weight: 500;
    margin-top: 10px;
    letter-spacing: 1.5px;
    animation: fadeIn 1s ease-out 0.4s both;
    transition: all 0.3s ease;
  }
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    animation: fadeIn 1s ease-out 0.6s both;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #a855f7;
    box-shadow: 0 0 8px #a855f7;
    animation: bounce 0.6s ease-in-out infinite alternate;
  }
  .dot:nth-child(2) {
    animation-delay: 0.18s;
    background: #c084fc;
    box-shadow: 0 0 8px #c084fc;
  }
  .dot:nth-child(3) {
    animation-delay: 0.36s;
    background: #06b6d4;
    box-shadow: 0 0 8px #06b6d4;
  }

  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    from { opacity: 0.3; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.3); }
  }
  @keyframes containerIn {
    from { opacity: 0; transform: scale(0.88); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="container" id="splash-container">
  <div class="logo-wrap">
    <div class="glow-ring"></div>
    <img class="logo" src="darkmaxxer://localhost/logo.png" alt="DarkMaxxer Logo" onerror="this.src='logo.png'">
  </div>
  <div class="title">DarkMaxxer</div>
  <div class="status-text" id="status-label">Initializing Autonomous Core...</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
  const splashStartTime = Date.now();
  const MIN_SPLASH_TIME = 3000;
  let transitioned = false;
  let isBackendReady = false;

  function proceedToApp() {
    if (transitioned) return;
    transitioned = true;
    document.body.style.transition = "opacity 0.35s ease-out";
    document.body.style.opacity = "0";
    setTimeout(() => {
      window.location.replace("darkmaxxer://localhost/index.html");
    }, 300);
  }

  async function checkBackendStatus() {
    if (isBackendReady) return true;
    try {
      if (window.pywebview && window.pywebview.api) {
        if (typeof window.pywebview.api.check_app_ready === 'function') {
          const res = await window.pywebview.api.check_app_ready();
          if (res && res.ready) {
            isBackendReady = true;
            return true;
          }
        }
        if (typeof window.pywebview.api.get_active_state === 'function') {
          const state = await window.pywebview.api.get_active_state();
          if (state && (state.engine_ready || state.settings)) {
            isBackendReady = true;
            return true;
          }
        }
      }
    } catch (err) {
      // Backend is still initializing, continue spinning
    }
    return false;
  }

  async function pollLoop() {
    if (transitioned) return;

    const elapsed = Date.now() - splashStartTime;
    const ready = await checkBackendStatus();

    const statusLabel = document.getElementById("status-label");
    if (elapsed >= MIN_SPLASH_TIME && !ready) {
      if (statusLabel) {
        if (elapsed > 8000) {
          statusLabel.innerText = "Synchronizing AI Engine & Hardware...";
        } else if (elapsed > 5000) {
          statusLabel.innerText = "Loading AI Workspaces & Model Cache...";
        } else {
          statusLabel.innerText = "Finalizing Engine Core...";
        }
      }
    }

    if ((elapsed >= MIN_SPLASH_TIME && ready) || elapsed >= 12000) {
      proceedToApp();
    } else {
      setTimeout(pollLoop, 100);
    }
  }

  window.addEventListener('pywebviewready', () => {
    pollLoop();
  });

  setTimeout(pollLoop, 200);
</script>

</body>
</html>
