[package]
name = "darkmaxxer"
version = "2.0.0"
edition = "2021"
authors = ["Vikalp Sharma"]
description = "The Ultimate Local AI Workspace in Rust"

[[bin]]
name = "darkmaxxer"
path = "src/main.rs"


[dependencies]
wry = "0.47"
tao = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
dirs = "5.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
